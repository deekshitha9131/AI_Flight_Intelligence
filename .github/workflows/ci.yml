name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend — Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check app tests

      - name: black (format check)
        run: black --check app tests

  backend-typecheck:
    name: Backend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy app

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real service containers, not mocks — this is what makes the
    # integration suite (tests/integration/) actually run in CI rather
    # than skip. The pgvector/pgvector image matches exactly what
    # docker-compose.yml uses locally, so "works in CI" and "works via
    # docker compose up" mean the same thing.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_email_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: "true"
      APP_SECRET_KEY: ci-test-secret-key
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_email_assistant_test
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "2"
      DATABASE_POOL_TIMEOUT: "30"
      DATABASE_POOL_RECYCLE: "1800"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CELERY_TASK_TIME_LIMIT: "300"
      CELERY_TASK_SOFT_TIME_LIMIT: "240"
      CELERY_MAX_RETRIES: "3"
      CELERY_RETRY_BACKOFF_MAX: "600"
      TOKEN_ENCRYPTION_KEY: ci-test-token-encryption-key
      ANTHROPIC_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: pytest (unit + integration, with real Postgres/Redis)
        run: pytest -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-lint:
    name: Frontend — Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: eslint
        run: npm run lint

      - name: prettier (format check)
        run: npm run format:check

  frontend-typecheck:
    name: Frontend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: tsc --noEmit
        run: npm run typecheck

  frontend-test:
    name: Frontend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      # --passWithNoTests: the frontend has no components/tests yet
      # (added in a later implementation phase) — without this flag,
      # vitest exits non-zero on an empty test suite, which would make
      # CI red for a reason that has nothing to do with a real failure.
      # Remove this flag once the first frontend test file exists, so
      # an accidentally-empty suite starts failing loudly again.
      - name: vitest
        run: npx vitest run --passWithNoTests

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck, backend-test, frontend-lint, frontend-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (production target)
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (production target)
        uses: docker/build-push-action@v5
        with:
          context: frontend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
