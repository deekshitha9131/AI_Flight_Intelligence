[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Date-prefixed filenames sort chronologically in a directory listing
# and are self-describing without opening the file — the alternative
# (Alembic's bare revision-hash default) makes `ls alembic/versions/`
# nearly useless for finding a specific migration by eye.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Left blank deliberately — alembic/env.py sets this dynamically from
# the application's own Settings (app/core/config.py) at runtime, so
# the same alembic.ini works unmodified against dev/staging/production
# without ever duplicating a connection string here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
