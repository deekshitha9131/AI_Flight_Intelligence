[alembic]
# Path to the migration environment package.
script_location = app/database/migrations

# The URL is populated dynamically from app.core.config.settings in env.py.
# Keep a placeholder so Alembic can initialize the config object.
sqlalchemy.url = postgresql://username:password@localhost:5432/flight_ai_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
 datefmt = %H:%M:%S
