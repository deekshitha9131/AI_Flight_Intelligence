# ==============================================================================
# Reverse proxy — the single public entry point in production.
# Routes:
#   /api/  -> api container   (FastAPI)
#   /ws/   -> api container   (websocket upgrade)
#   /      -> frontend container (static build served by its own nginx,
#                                  or the Vite dev server in development —
#                                  either way, this proxy just forwards)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream api_upstream {
        server api:8000;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # REST API
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Websocket upgrade path — separate location because it needs the
        # Upgrade/Connection headers that a plain HTTP proxy_pass doesn't set.
        location /ws/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Everything else goes to the frontend container. This proxy never
        # serves files directly — that responsibility stays inside the
        # frontend container's own image (nginx in production, Vite's dev
        # server in development), so this file doesn't change between environments.
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
