services:
  postgres:
    image: postgres:15
    container_name: ai-flight-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deekshitha1234
      POSTGRES_DB: ai_flight_intelligence
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-flight-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
